[project]
name = "hermecious-api"
version = "0.1.0"
description = "Hermecious API and worker"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "pydantic-settings>=2.16.1",
    "psycopg[binary]>=3.3.6",
    "redis>=8.1.0",
    "rq>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
