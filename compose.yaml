# Local development stack (P0.2). Runbook: docs/runbooks/local-development.md
# Postgres and Redis are reachable only on the internal Compose network; the
# API and web ports are published on 127.0.0.1 only.
name: hermecious

x-app-service: &app-service
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-app-environment: &app-environment
  HERMECIOUS_ENV: ${HERMECIOUS_ENV:?set HERMECIOUS_ENV in .env}
  HERMECIOUS_LOG_LEVEL: ${HERMECIOUS_LOG_LEVEL:-INFO}
  HERMECIOUS_ALLOWED_ORIGINS: ${HERMECIOUS_ALLOWED_ORIGINS:?set HERMECIOUS_ALLOWED_ORIGINS in .env}
  HERMECIOUS_SESSION_COOKIE_SECURE: ${HERMECIOUS_SESSION_COOKIE_SECURE:-false}
  # POSTGRES_PASSWORD must be URL-safe (openssl rand -hex 32).
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  REDIS_URL: redis://redis:6379/0

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      # Postgres 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    # Broker only (ADR-009): no persistence; Postgres is the system of record.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app-service
    build: ./apps/api
    environment: *app-environment
    ports:
      - "127.0.0.1:${HERMECIOUS_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness only; dependency readiness is GET /health/ready.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  worker:
    <<: *app-service
    build: ./apps/api
    command: ["python", "-m", "app.workers"]
    environment: *app-environment
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Fails unless this worker's own RQ heartbeat in Redis is fresh.
      test: ["CMD", "python", "-m", "app.workers.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Integration test runner (P0.3). Only started via the `test` profile by
  # scripts/test-integration.sh, in a throwaway project with its own volume.
  api-test:
    profiles: ["test"]
    build:
      context: ./apps/api
      target: test
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      <<: *app-environment
      HERMECIOUS_ENV: test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    <<: *app-service
    build: ./apps/web
    ports:
      - "127.0.0.1:${HERMECIOUS_WEB_PORT:-3000}:3000"
    healthcheck:
      # Web server liveness only; it does not check the API.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres-data:
